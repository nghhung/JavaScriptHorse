<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Lucky Racing</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="game.css" />
		<script src="game.js"></script>
	</head>

	<body>


	<!-- Self added bit Countdown Timer -->
		<div id = "countDown">

		</div>

	<!-- Self added bit modal window -->
		<div id = "modal">
			<span id = "close"></span>
			<div id = "modalRight">
				<div class="heroContent">
					<h1>Đua Ngựa Khai Xuân</h1>
					<h3>- ENOUVO</h3>
					<div id = "playButtonHolder"><button id = "playButton">Đua Ngựa Nào</button></div>
					<h3 class="tagline">Cùng đặt cược nào, mại zô mại zô!</h3>
				</div>

			</div>
			
		</div>

		<div id="horse1" class="horse standRight">
			<div class="horseName">Anh Huy</div>
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div id="horse2" class="horse standRight">
			<div class="horseName">Anh Trường</div>
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div id="horse3" class="horse standRight">
			<div class="horseName">Anh Nhân</div>
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div id="horse4" class="horse standRight">
			<div class="horseName">Chị Thu Trang</div>
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div class="track">
			<div id="startline">

			</div>
			<div class="inner">
				<div id="start">
					🏁 Bắt Đầu
				</div>

				<div id="controls">
					<label>Số vòng:</label>
					<input type="number" id="lapNumber" value="1">
					<div id="status"></div>
					<div id="winner"></div>
				</div>
				
				
			<table id="results">
				<thead>
				<tr>
					<th>Kết Quả</th>
					<th></th>
				</tr>
				</thead>
				<tr>
					<td>Anh Huy</td>
					<td class="horse1"></td>
				</tr>
				<tr>
					<td>Anh Trường</td>
					<td class="horse2"></td>
				</tr>
				<tr>
					<td>Anh Nhân</td>
					<td class="horse3"></td>
				</tr>
				<tr>
					<td>Chị Thu Trang</td>
					<td class="horse4"></td>
				</tr>
			</table>

			<!-- Effects Legend -->
			<div id="effectsLegend">
				<div class="legendHeader">Các Hiệu Ứng</div>
				<div class="legendItem">
					<span class="legendIcon">💰</span>
					<span class="legendText">Được thưởng (Tăng tốc)</span>
				</div>
				<div class="legendItem">
					<span class="legendIcon">📉</span>
					<span class="legendText">Giảm lương (Chậm lại)</span>
				</div>
				<div class="legendItem">
					<span class="legendIcon">📈</span>
					<span class="legendText">Đón con (Nhảy vọt)</span>
				</div>
				<div class="legendItem">
					<span class="legendIcon">⬇️</span>
					<span class="legendText">Tám chuyện (Dừng lại)</span>
				</div>
			</div>
</div>

		</div>
		<div id = "lapDisplay"></div>

		<!-- Event Notification -->
		<div id="eventNotification"></div>




	</body>
</html>
