<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Lucky Racing</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="game.css" />
		<script src="game.js"></script>
	</head>

	<body>


	<!-- Self added bit Countdown Timer -->
		<div id = "countDown">

		</div>

	<!-- Self added bit modal window -->
		<div id = "modal">
			<span id = "close"></span>
			<div id = "modalRight">
				<div class="heroContent">
					<h1>Lucky Racing</h1>
					<h3>- By Diwas Lamsal</h3>
					<div id = "playButtonHolder"><button id = "playButton">Start Game</button></div>
					<h3 class="tagline">Click Start to run a race and see who wins!</h3>
				</div>

			</div>
			
		</div>

		<div id="horse1" class="horse standRight">
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div id="horse2" class="horse standRight">
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div id="horse3" class="horse standRight">
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div id="horse4" class="horse standRight">
			<div class="rider">
				<div class="head">
				</div>

				<div class="body">
				</div>
			</div>
		</div>


		<div class="track">
			<div id="startline">

			</div>
			<div class="inner">
				<div id="start">
					Start Race
				</div>

				<div id="controls">
					<label>Laps:</label>
					<input type="number" id="lapNumber" value="1">
					<div id="status"></div>
					<div id="winner"></div>
				</div>
			

				
				
			<table id="results">
				<thead>
				<tr>
					<th>Results</th>
					<th></th>
				</tr>
				</thead>
				<tr>
					<td>1st</td>
					<td class="horse1"></td>
				</tr>
				<tr>
					<td>2nd</td>
					<td class="horse2"></td>
				</tr>
				<tr>
					<td>3rd</td>
					<td class="horse3"></td>
				</tr>
				<tr>
					<td>4th</td>
					<td class="horse4"></td>
				</tr>
			</table>
</div>

		</div>
		<div id = "lapDisplay"></div>



	
	</body>
</html>
